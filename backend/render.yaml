# Render Blueprint — free web service for the FastAPI backend.
# Create the service via "New + > Blueprint" pointing at this repo, or set up
# a Web Service manually with the build/start commands below.
services:
  - type: web
    name: maintenance-bot-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false   # set to your Vercel URL, e.g. https://your-app.vercel.app
      - key: GEMINI_EMBED_DIM
        value: "768"  # MUST match the committed embeddings.npy or the server
                      # rebuilds embeddings on every cold start (see embed.py)
      - key: RERANK_ENABLED
        value: "1"    # declared here, not only in the dashboard: it changes
                      # ranking, and two sources of truth for it meant local and
                      # prod could rank differently with nothing to show for it
      - key: PDF_BUCKET_BASE
        sync: false   # R2 public base URL; build-time only, but kept visible
      - key: PYTHON_VERSION
        value: "3.11.9"
